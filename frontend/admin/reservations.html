<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약하기 관리 — 이제준</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로그인 확인 중 (토큰이 없으면 로그인 화면으로 이동) -->
  <p class="auth-check" id="auth-check">관리자 인증을 확인하는 중…</p>

  <main class="admin-container" id="admin-screen">
    <header class="admin-header">
      <div class="admin-title-wrap">
        <h1>예약하기 관리</h1>
        <p>방문 예약 요청을 확인하고 처리 상태를 지정합니다.</p>
      </div>
      <div class="admin-actions">
        <a href="index.html" class="btn btn-outline" id="tab-projects">프로젝트 관리</a>
        <a href="reservations.html" class="btn btn-primary" id="tab-reservations" aria-current="page">예약하기 관리</a>
        <a href="../index.html" class="btn btn-outline" target="_blank">사이트 보기 ↗</a>
        <button type="button" class="btn btn-outline" id="btn-logout">로그아웃</button>
      </div>
    </header>

    <!-- 처리 상태 요약 문장 -->
    <p class="rv-summary-text" id="rv-summary-text" aria-live="polite"></p>

    <!-- 처리 상태 필터 -->
    <div class="rv-filter" id="rv-filter" role="group" aria-label="처리 상태 필터"></div>
    <p class="rv-filter-note" id="rv-filter-note" aria-live="polite"></p>

    <!-- 예약 목록 테이블 (페이지를 열면 바로 표시) -->
    <section class="rv-card">
      <div class="rv-table-wrap">
        <table class="rv-table" id="rv-table">
          <thead>
            <tr>
              <th scope="col">예약 번호</th>
              <th scope="col">신청자/이메일</th>
              <th scope="col">방문 희망 시간</th>
              <th scope="col">방문 목적</th>
              <th scope="col">처리 상태</th>
              <th scope="col">관리</th>
            </tr>
          </thead>
          <tbody id="rv-body">
            <tr><td colspan="6" class="rv-empty">불러오는 중…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 예약 가져오기 -->
    <details class="rv-card rv-import" id="rv-import">
      <summary>예약 가져오기 (Formspree 내보내기 파일)</summary>
      <div class="rv-import-body">
        <p class="rv-hint">
          Formspree 폼의 <b>Submissions</b>에서 내보낸 <b>CSV 또는 JSON</b> 파일을 선택하거나 내용을 붙여넣으세요.
          같은 신청자의 같은 희망 시간은 중복으로 보고 건너뜁니다. 새로 들어온 예약은 처리 상태가 <b>접수</b>로 시작합니다.
        </p>
        <input type="file" id="rv-file" accept=".csv,.json,text/csv,application/json">
        <textarea id="rv-text" class="form-control mono" rows="5" placeholder="CSV 또는 JSON 내용을 붙여넣기"></textarea>
        <div class="rv-import-actions">
          <button type="button" class="btn btn-primary" id="rv-import-btn">가져오기</button>
          <span class="rv-hint" id="rv-import-result" role="status"></span>
        </div>
      </div>
    </details>
  </main>

  <div class="toast-box" id="toast"></div>
  <script src="reservations.js"></script>
</body>
</html>
