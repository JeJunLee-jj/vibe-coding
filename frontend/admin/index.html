<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 관리자 CMS — 이제준</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 관리자 로그인 화면 (보안) -->
  <section class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-header">
        <h1>관리자 인증</h1>
        <p>프로젝트를 등록 및 수정하려면 비밀번호를 입력하세요.</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-password">관리자 비밀번호</label>
          <input
            type="password"
            id="admin-password"
            class="form-control"
            placeholder="관리자 비밀번호를 입력하세요"
            autocomplete="off"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
          로그인
        </button>
        <div style="margin-top:16px;text-align:center">
          <a href="../index.html" class="mono" style="font-size:12px;color:var(--muted);text-decoration:none">
            ← 포트폴리오 메인으로 돌아가기
          </a>
        </div>
      </form>
    </div>
  </section>

  <!-- 2. 관리자 메인 대시보드 화면 -->
  <main class="admin-container" id="admin-screen">
    <header class="admin-header">
      <div class="admin-title-wrap">
        <h1>프로젝트 단위별 관리 (CMS)</h1>
        <p>포트폴리오의 프로젝트를 등록, 수정하고 공개/초안 상태를 제어합니다.</p>
      </div>
      <div class="admin-actions">
        <a href="reservations.html" class="btn btn-primary" id="tab-reservations">예약하기 관리</a>
        <a href="../index.html" class="btn btn-outline" target="_blank">사이트 보기 ↗</a>
        <a href="../dashboard/index.html" class="btn btn-outline" target="_blank">점검 대시보드 ↗</a>
        <button type="button" class="btn btn-outline" id="btn-logout">로그아웃</button>
      </div>
    </header>

    <div class="admin-grid">
      <!-- 좌측: 프로젝트 등록 및 수정 폼 -->
      <section class="editor-card">
        <div class="editor-head">
          <h2 id="form-title">새 프로젝트 등록</h2>
          <button type="button" class="btn btn-outline btn-sm" id="btn-reset-form" style="display:none">
            새로 등록하기로 전환
          </button>
        <div class="edit-banner" id="edit-banner">
          <span id="edit-banner-text">📌 선택한 프로젝트를 불러왔습니다.</span>
          <button type="button" class="btn btn-outline btn-sm" id="btn-banner-close" style="padding:2px 8px;font-size:11px">닫기</button>
        </div>

        <form id="project-form">
          <input type="hidden" id="edit-project-id" value="" />

          <!-- 제목 -->
          <div class="form-group">
            <label for="p-title">
              프로젝트 제목 <span class="req" title="공개 시 필수">*</span>
            </label>
            <input
              type="text"
              id="p-title"
              class="form-control"
              placeholder="예: 화답숲: 도심 열섬 완화를 위한 조경 설계 및 공간 대시보드"
            />
          </div>

          <!-- 내가 한 역할 -->
          <div class="form-group">
            <label for="p-role">
              내가 한 역할 <span class="req" title="공개 시 필수">*</span>
            </label>
            <input
              type="text"
              id="p-role"
              class="form-control"
              placeholder="예: 패널 구성 총괄, 수종 식재 계획 및 GeoJSON 공간 데이터 시각화 구현"
            />
          </div>

          <!-- 프로젝트 설명 -->
          <div class="form-group">
            <label for="p-description">
              프로젝트 설명 <span class="req" title="공개 시 필수">*</span>
            </label>
            <textarea
              id="p-description"
              class="form-control"
              rows="4"
              placeholder="예: 천안 원도심 녹지 축 조성을 목표로 다층 식재 시뮬레이션을 수행하고, 실시간 온습도 센서 데이터를 웹 대시보드로 시각화하여 사용자가 직관적으로 이해할 수 있도록 설계했습니다."
            ></textarea>
          </div>

          <!-- 날짜 (기간) -->
          <div class="form-group">
            <label for="p-period">
              날짜 (기간) <span class="req" title="공개 시 필수">*</span>
            </label>
            <input
              type="text"
              id="p-period"
              class="form-control mono"
              placeholder="예: 2024.03 — 2024.06"
            />
          </div>

          <!-- 참여인원 수 -->
          <div class="form-group">
            <label for="p-teamsize">
              참여인원 수 (명) <span class="req" title="공개 시 필수">*</span>
            </label>
            <input
              type="text"
              id="p-teamsize"
              class="form-control mono"
              placeholder="예: 4 (본인 포함 팀원 수)"
            />
          </div>

          <!-- 참고사항 -->
          <div class="form-group">
            <label for="p-notes">
              참고사항 <span class="opt">(선택 입력)</span>
            </label>
            <textarea
              id="p-notes"
              class="form-control"
              rows="2"
              placeholder="예: 교내 캡스톤 디자인 우수상 수상작 / 발표 자료 링크 / GitHub 링크 등"
            ></textarea>
          </div>

          <!-- 공개 여부 (초안 vs 공개 선택 탭) -->
          <div class="form-group">
            <label>게시 상태 선택</label>
            <div class="status-selector">
              <label class="radio-chip selected-pub" id="chip-published">
                <input type="radio" name="p-status" value="published" checked />
                <div>
                  <b style="color:var(--accent)">🚀 공개 (Published)</b>
                  <div style="font-size:11.5px;color:var(--muted);margin-top:2px">일반 방문자가 웹사이트에서 바로 열람 가능</div>
                </div>
              </label>
              <label class="radio-chip" id="chip-draft">
                <input type="radio" name="p-status" value="draft" />
                <div>
                  <b style="color:var(--badge-draft-text)">📝 초안 (Draft)</b>
                  <div style="font-size:11.5px;color:var(--muted);margin-top:2px">모든 칸을 채우지 않아도 임시저장 (비공개)</div>
                </div>
              </label>
            </div>
          </div>

          <!-- 규칙 안내 팁 -->
          <div class="form-notice" id="status-guide-text">
            💡 <b>공개 상태:</b> 참고사항 외 모든 칸(제목, 역할, 설명, 날짜, 참여인원)을 채워야 메인 사이트에 게시됩니다.
          </div>

          <!-- 듀얼 액션 버튼 (임시저장 vs 공개저장) -->
          <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
            <button type="button" class="btn btn-draft" id="btn-save-draft" style="flex:1;justify-content:center;padding:11px 16px">
              📝 초안으로 임시저장
            </button>
            <button type="button" class="btn btn-publish" id="btn-save-publish" style="flex:1.2;justify-content:center;padding:11px 16px">
              🚀 사이트에 공개 저장
            </button>
            <button type="button" class="btn btn-outline" id="btn-cancel" style="display:none;padding:11px 16px">
              취소
            </button>
          </div>
        </form>
      </section>

      <!-- 우측: 등록된 프로젝트 목록 -->
      <section class="list-card">
        <div class="list-head">
          <div>
            <h2>등록된 프로젝트 목록</h2>
            <span class="proj-count mono" id="proj-summary-text">불러오는 중...</span>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="btn-refresh">새로고침</button>
        </div>

        <!-- 중복 의심 프로젝트 안내 (제목이 같은 항목) -->
        <div id="dup-banner" class="dup-banner" hidden></div>

        <div class="items-stack" id="projects-container">
          <!-- JS 렌더링 -->
        </div>
      </section>
    </div>
  </main>

  <!-- 토스트 알림 -->
  <div class="toast-box" id="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
