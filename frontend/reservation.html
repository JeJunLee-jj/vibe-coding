<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방문 예약 · 이제준 포트폴리오</title>
  <meta name="description" content="이제준에게 방문 예약을 신청하는 페이지입니다.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

  <style>
    :root {
      --bg: #FBFBF9;
      --surface: #FFFFFF;
      --ink: #1A1D1A;
      --ink-2: #414741;
      --muted: #6D746C;
      --line: #E2E5DF;
      --line-2: #EDEFEA;
      --accent: #2E7D53;
      --accent-bg: #EAF3EE;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101210;
        --surface: #181B18;
        --ink: #E9ECE8;
        --ink-2: #C2C8C1;
        --muted: #949B93;
        --line: #282C28;
        --line-2: #1F231F;
        --accent: #63BE8E;
        --accent-bg: #15251C;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding-inline: 24px; }
    @media (max-width: 640px) { .wrap { padding-inline: 18px; } }

    /* 상단 내비게이션 */
    nav {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding-block: 14px;
    }
    .nav-inner {
      max-width: 880px; margin: 0 auto; padding-inline: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
      color: var(--muted); text-decoration: none;
      padding: 6px 11px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface); transition: border-color .15s, color .15s;
    }
    .nav-back:hover { border-color: var(--accent); color: var(--accent); }
    .nav-back svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }

    /* 히어로 */
    .page-header { padding-block: 56px 52px; }
    .page-header .who {
      font-family: "IBM Plex Mono", monospace; font-size: 12px;
      color: var(--accent); margin: 0 0 14px; letter-spacing: .04em;
      text-transform: uppercase;
    }
    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 700; line-height: 1.25;
      margin: 0; letter-spacing: -.02em;
    }
    .page-header .desc {
      font-size: clamp(.95rem, 2.4vw, 1.1rem); color: var(--ink-2);
      margin: 18px 0 0; max-width: 44ch; line-height: 1.8;
    }

    /* 준비중 영역 */
    .coming-soon {
      border-top: 1px solid var(--line);
      padding-block: 72px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 16px;
    }
    .coming-icon {
      font-size: 48px; line-height: 1;
    }
    .coming-soon h2 {
      font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -.02em;
    }
    .coming-soon p {
      margin: 0; font-size: 14px; color: var(--muted); max-width: 36ch; line-height: 1.8;
    }
    .coming-tag {
      display: inline-block;
      font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px;
      background: var(--accent-bg); color: var(--accent);
      letter-spacing: .04em;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 8px;
      font-family: "IBM Plex Sans KR", sans-serif; font-size: 14px; font-weight: 600;
      color: var(--accent); text-decoration: none;
      padding: 11px 22px; border: 1px solid var(--accent); border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .back-btn:hover { background: var(--accent-bg); }
    .back-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    footer {
      border-top: 1px solid var(--line); padding-block: 22px 40px;
      font-size: 12px; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 6px 18px;
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- 상단 내비게이션 -->
  <nav>
    <div class="nav-inner">
      <a href="visit.html" class="nav-back" id="nav-back-btn">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        찾아오는 길로 돌아가기
      </a>
      <span class="nav-title">방문 예약</span>
    </div>
  </nav>

  <div class="wrap">

    <!-- 히어로 -->
    <header class="page-header">
      <p class="who">RESERVATION</p>
      <h1>방문 예약하기</h1>
      <p class="desc">
        방문 일정을 예약해 주시면 확인 후 이메일로 안내드립니다.
      </p>
    </header>

    <!-- 준비중 -->
    <section class="coming-soon" id="coming-soon-section">
      <div class="coming-icon">📅</div>
      <span class="coming-tag">COMING SOON</span>
      <h2>예약 기능 준비 중입니다</h2>
      <p>
        방문 예약 양식은 현재 개발 중입니다.<br>
        그 전까지는 이메일로 방문 의사를 알려주시면 안내해 드리겠습니다.
      </p>
      <a href="mailto:dvae1456@gmail.com" class="back-btn" id="email-contact-btn">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        이메일로 문의하기
      </a>
      <a href="visit.html" class="back-btn" id="back-to-visit-btn" style="border-color:var(--line);color:var(--ink-2);background:transparent;">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        찾아오는 길로 돌아가기
      </a>
    </section>

  </div>

  <footer class="wrap">
    <span>© 2025 이제준 · 상명대학교 조경학과</span>
    <a href="index.html" style="color:inherit;text-decoration:none;">← 포트폴리오로 돌아가기</a>
  </footer>

</body>
</html>
